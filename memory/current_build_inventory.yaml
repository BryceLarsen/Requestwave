# RequestWave Current Build Inventory
# Canonical source of truth: /app/memory/current_build_inventory.yaml
# Generated: 2026-01-16
# Last Updated: 2026-01-21 (Orientation implementation + click tracking documentation)

# =============================================================================
# SECTION 1: PHASE 2 - AUDIENCE INTERACTION CAPTURE
# =============================================================================
# Phase 2 implements stable anonymous audience identification and event logging.

audience_identity:
  description: >
    Anonymous, stable identifier for tracking audience actions across a session
    and repeat visits on the same device/browser without requiring login.
  
  client_implementation:
    location: /app/frontend/src/App.js
    storage: localStorage
    key: requestwave_audience_id
    generation: crypto.randomUUID()
    behavior: >
      Generated on first audience interaction, persisted across sessions.
      Same audience_id reused for all requests/tips from same browser.
    
  backend_models_updated:
    - model: RequestCreate
      field: audience_id
      type: Optional[str]
      
    - model: TipCreate
      field: audience_id
      type: Optional[str]
      
    - model: Request
      field: audience_id
      type: Optional[str]

  endpoints_accepting_audience_id:
    - route: POST /api/requests
      field_in_body: audience_id
      stored_on: request document
      
    - route: POST /api/musicians/{slug}/requests
      field_in_body: audience_id
      stored_on: request document
      
    - route: POST /api/musicians/{slug}/tips
      field_in_body: audience_id
      stored_on: tip document
      
    - route: POST /api/requests/{id}/track-click
      field_in_body: audience_id
      used_in: analytics events only (not stored on request)
      
    - route: POST /api/requests/{id}/email
      field_in_body: audience_id
      purpose: "Moment 3 email capture - attach email to request post-submission"
      security: >
        If request has audience_id AND body.audience_id differs: 403 Forbidden.
        If request has no audience_id AND body.audience_id provided: sets it on request.
      stored_on: request document (requester_email field)

# =============================================================================
# SECTION 2: PHASE 2 - ANALYTICS EVENTS
# =============================================================================
# Four new event types added for audience interaction capture.

phase2_analytics_events:
  
  # ─────────────────────────────────────────────────────────────────────────────
  # EVENT 1: audience.dedication_submitted
  # ─────────────────────────────────────────────────────────────────────────────
  - event_type: audience.dedication_submitted
    trigger: "Request created with non-empty, non-whitespace dedication"
    emitted_from:
      - POST /api/requests
      - POST /api/musicians/{slug}/requests
    context_fields:
      - musician_id: "Always present"
      - show_id: "From musician's current_show_id"
      - entity_id: "request_id"
      - entity_type: "request"
    metadata:
      - song_id: "ID of requested song"
      - song_title: "Title of requested song"
      - dedication_length: "Character count of dedication text"
      - audience_id: "Client-provided anonymous ID (may be null)"
    conditional: "Only emitted if dedication.strip() is non-empty"
  
  # ─────────────────────────────────────────────────────────────────────────────
  # EVENT 2: audience.tip_clicked
  # ─────────────────────────────────────────────────────────────────────────────
  - event_type: audience.tip_clicked
    trigger: "Audience clicks a tip payment link (Venmo, PayPal, etc.)"
    emitted_from:
      - POST /api/requests/{id}/track-click
    context_fields:
      - musician_id: "From request document"
      - show_id: "From request document"
      - entity_id: "request_id"
      - entity_type: "request"
    metadata:
      - platform: "venmo | paypal | cashapp | zelle"
      - audience_id: "Client-provided anonymous ID (may be null)"
  
  # ─────────────────────────────────────────────────────────────────────────────
  # EVENT 3: audience.follow_clicked
  # ─────────────────────────────────────────────────────────────────────────────
  - event_type: audience.follow_clicked
    trigger: "Audience clicks a social follow link (Instagram, Spotify, etc.)"
    emitted_from:
      - POST /api/requests/{id}/track-click
    context_fields:
      - musician_id: "From request document"
      - show_id: "From request document"
      - entity_id: "request_id"
      - entity_type: "request"
    metadata:
      - platform: "instagram | facebook | tiktok | spotify | apple_music"
      - audience_id: "Client-provided anonymous ID (may be null)"
  
  # ─────────────────────────────────────────────────────────────────────────────
  # EVENT 4: audience.tip_completed
  # ─────────────────────────────────────────────────────────────────────────────
  - event_type: audience.tip_completed
    trigger: "Audience submits a tip record"
    emitted_from:
      - POST /api/musicians/{slug}/tips
    context_fields:
      - musician_id: "From musician lookup"
      - show_id: "From tip_data.show_id or musician's current_show_id"
      - entity_id: "tip_id"
      - entity_type: "tip"
    metadata:
      - amount: "Tip amount in dollars"
      - platform: "venmo | paypal | cashapp | zelle"
      - audience_id: "Client-provided anonymous ID (may be null)"

  # ─────────────────────────────────────────────────────────────────────────────
  # EVENT 5: audience.email_submitted
  # ─────────────────────────────────────────────────────────────────────────────
  - event_type: audience.email_submitted
    trigger: "Audience submits email in Moment 3 (post-request follow-up)"
    emitted_from:
      - POST /api/requests/{id}/email
    context_fields:
      - musician_id: "From request document"
      - show_id: "From request document"
      - entity_id: "request_id"
      - entity_type: "request"
    metadata:
      - email_provided: "true (boolean, raw email NOT included for privacy)"
      - audience_id: "Client-provided anonymous ID (may be null)"
    note: "Added for Audience Moment Model - captures optional follow-up email"

# =============================================================================
# SECTION 3: ENDPOINTS WITH SHOW_ID QUERY PARAMETER
# =============================================================================
# These 3 endpoints accept an optional show_id query parameter.
# Scoping rules are explicit per endpoint below.

endpoints_with_show_id:

  # ─────────────────────────────────────────────────────────────────────────────
  # ENDPOINT 1: GET /api/song-suggestions
  # ─────────────────────────────────────────────────────────────────────────────
  - route: GET /api/song-suggestions
    file: /app/backend/server.py
    decorator_line: 3211
    handler: get_song_suggestions
    
    query_params:
      - name: show_id
        type: Optional[str]
        default: null
    
    scoping_rules:
      always: "Scopes by musician_id (from JWT auth)"
      when_show_id_provided: "Additionally scopes by show_id"
      when_show_id_omitted: "Returns ALL suggestions for musician (no show filtering)"
    
    additional_filters: null  # No status filtering on this endpoint
    
    frontend_callers:
      - view: "On Stage tab"
        must_pass_show_id: true
        call: "fetchSongSuggestions(currentShow.id)"
      - view: "Songs tab (Learn Later)"
        must_pass_show_id: false
        call: "fetchSongSuggestions()"
      - view: "Requests tab"
        must_pass_show_id: false
        call: "fetchSongSuggestions()"

  # ─────────────────────────────────────────────────────────────────────────────
  # ENDPOINT 2: GET /api/requests/musician/{musician_id}
  # ─────────────────────────────────────────────────────────────────────────────
  - route: GET /api/requests/musician/{musician_id}
    file: /app/backend/server.py
    decorator_line: 4177
    handler: get_musician_requests
    
    query_params:
      - name: show_id
        type: Optional[str]
        default: null
    
    scoping_rules:
      always: "Scopes by musician_id (from path param, verified against JWT)"
      when_show_id_provided: "Additionally scopes by show_id"
      when_show_id_omitted: "Returns ALL non-archived requests for musician"
    
    additional_filters:
      - field: status
        condition: "$ne: 'archived'"
        description: "Always excludes archived requests regardless of show_id"
    
    frontend_callers:
      - view: "On Stage tab"
        must_pass_show_id: true
        call: "fetchRequests(currentShow.id)"
      - view: "Requests tab"
        must_pass_show_id: false
        call: "fetchRequests()"

  # ─────────────────────────────────────────────────────────────────────────────
  # ENDPOINT 3: GET /api/requests/grouped
  # ─────────────────────────────────────────────────────────────────────────────
  - route: GET /api/requests/grouped
    file: /app/backend/server.py
    decorator_line: 5454
    handler: get_requests_grouped_by_show
    
    query_params:
      - name: show_id
        type: Optional[str]
        default: null
    
    scoping_rules:
      always: "Scopes by musician_id (from JWT auth)"
      when_show_id_provided: "Additionally scopes by show_id"
      when_show_id_omitted: "Returns ALL requests for musician grouped by show_name"
    
    additional_filters: null  # No status filtering on this endpoint (includes archived)
    
    frontend_callers:
      - view: "Requests tab"
        must_pass_show_id: false
        call: "fetchGroupedRequests()"
    
    not_called_by:
      - view: "On Stage tab"
        reason: "On Stage uses GET /api/requests/musician/{id}?show_id=... instead (excludes archived)"

# =============================================================================
# SECTION 2: FRONTEND FETCH FUNCTIONS
# =============================================================================
frontend_fetch_functions:
  file: /app/frontend/src/App.js
  
  functions:
    - name: fetchSongSuggestions
      signature: "async (showId = null)"
      url_construction: |
        showId 
          ? `${API}/song-suggestions?show_id=${showId}`
          : `${API}/song-suggestions`
    
    - name: fetchRequests
      signature: "async (showId = null)"
      url_construction: |
        showId
          ? `${API}/requests/musician/${musician.id}?show_id=${showId}`
          : `${API}/requests/musician/${musician.id}`
    
    - name: fetchGroupedRequests
      signature: "async (showId = null)"
      url_construction: |
        showId
          ? `${API}/requests/grouped?show_id=${showId}`
          : `${API}/requests/grouped`

  on_stage_useEffect:
    trigger: "activeTab === 'onstage' && currentShow"
    behavior: "Re-fetches data scoped to currentShow.id"
    calls:
      - "fetchRequests(currentShow.id)"
      - "fetchSongSuggestions(currentShow.id)"

# =============================================================================
# SECTION 3: TEST COVERAGE
# =============================================================================
test_coverage:
  file: /app/backend/tests/test_show_scoping.py
  run_command: "cd /app/backend && python -m pytest tests/test_show_scoping.py -v"
  
  tests:
    - name: test_suggestions_with_show_id_returns_only_that_show
      verifies: "show_id filter returns only matching suggestions"
    - name: test_suggestions_with_different_show_id_returns_different_set
      verifies: "different show_id returns different suggestions"
    - name: test_suggestions_without_show_id_returns_all
      verifies: "omitting show_id returns all (backward compatible)"
    - name: test_requests_with_show_id_returns_only_that_show
      verifies: "show_id filter returns only matching requests"
    - name: test_requests_with_different_show_id_returns_different_set
      verifies: "different show_id returns different requests"
    - name: test_requests_without_show_id_returns_all
      verifies: "omitting show_id returns all (backward compatible)"
    - name: test_grouped_requests_with_show_id_returns_only_that_show
      verifies: "show_id filter scopes grouped response"
    - name: test_grouped_requests_without_show_id_returns_all
      verifies: "omitting show_id returns all grouped (backward compatible)"
    - name: test_show_scoping_exact_counts
      verifies: "exact counts match expected values per show"

