# =============================================================================
# SECTION 7: AUDIENCE EXPERIENCE (CURRENT STATE)
# =============================================================================
# Factual snapshot of audience-facing functionality as implemented.

audience_experience_current_state:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Entry and Routing
  # ─────────────────────────────────────────────────────────────────────────────
  entry_and_routing:
    audience_url_pattern: "/musician/:slug"
    example_url: "https://[domain]/musician/john-doe"
    qr_destination: "Same as audience_url_pattern (musician's personalized request page)"
    redirects: "None - direct access to musician's page"
    prerequisites:
      - "Musician must exist with matching slug"
      - "Musician's audience_link_active must be true (checked via /api/musicians/{slug}/access-check)"
    access_denied_behavior: >
      If access_check returns access_granted=false, page displays access denied message
      and does not load songs or allow requests.

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Screen/Step Sequence
  # ─────────────────────────────────────────────────────────────────────────────
  screen_sequence:
    structure: "Single-page application (SPA)"
    flow_type: "Single page with modal overlays for interactions"
    
    steps:
      - step: 1
        name: "Page Load"
        description: >
          Audience arrives at /musician/:slug. Page fetches musician profile,
          songs, filters, playlists, and design settings. Access check is performed.
        visible_elements:
          - "Musician name/bio header"
          - "Artist photo (if configured)"
          - "Search bar"
          - "Filter dropdowns (genre, playlist, mood, decade)"
          - "Sort options (Most Popular, A-Z, Newest, Random)"
          - "Song grid or list (based on layout_mode)"
          - "Suggest a Song button"
          
      - step: 2
        name: "Song Selection"
        description: >
          Audience browses/filters/searches songs. Clicks on a song card to
          open request modal.
        user_actions:
          - "Search by title/artist"
          - "Filter by genre/playlist/mood/decade"
          - "Sort songs"
          - "Click song to open request modal"
          - "Click 'Pick Random Song' button"
          - "Click 'Suggest a Song' for unlisted songs"
          
      - step: 3
        name: "Request Form Modal"
        description: >
          Modal appears with selected song details. Audience fills in name, email,
          optional dedication. Submits request.
        user_actions:
          - "Enter requester name (required)"
          - "Enter requester email (required)"
          - "Enter dedication/note (optional)"
          - "Submit request"
          
      - step: 4
        name: "Post-Request Tip Modal"
        description: >
          After successful request submission, if musician has tips_enabled=true,
          tip modal appears prompting for optional tip.
        conditional: "Only shown if musician.tips_enabled is true"
        user_actions:
          - "Select preset amount ($1, $5, $10, $20) or enter custom"
          - "Enter optional tip message"
          - "Select payment platform (Venmo/PayPal/CashApp/Zelle)"
          - "Submit tip (opens external payment link)"
          - "Skip (closes modal, proceeds to social follow)"
          
      - step: 5
        name: "Social Follow Modal"
        description: >
          After tip flow (or if tips disabled), social follow modal appears
          with links to musician's social profiles.
        user_actions:
          - "Click social links (Instagram, Facebook, TikTok, Spotify, Apple Music)"
          - "Close modal to return to song list"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Inputs and Requirements
  # ─────────────────────────────────────────────────────────────────────────────
  inputs:
    request_form:
      - field: "requester_name"
        label_shown: "Your Name"
        required: true
        stored_on: "request document"
        validation: "Must be non-empty"
        
      - field: "requester_email"
        label_shown: "Your Email"
        required: true
        stored_on: "request document"
        validation: "Must be non-empty (no format validation)"
        
      - field: "dedication"
        label_shown: "Dedication (optional)"
        required: false
        stored_on: "request document"
        validation: "None (can be empty or any text)"
        
      - field: "tip_amount"
        label_shown: "Tip Amount"
        required: false
        stored_on: "request document (tip_amount field)"
        validation: "If provided, must be valid number between 0 and 500"
        note: "Stored on request but actual payment handled externally"

    tip_form:
      - field: "amount"
        label_shown: "Amount ($)"
        required: true
        stored_on: "tips collection document"
        validation: "Must be positive number, max $500"
        
      - field: "platform"
        label_shown: "Payment Method (selector)"
        required: true
        stored_on: "tips collection document"
        validation: "One of: paypal, venmo, cashapp, zelle"
        
      - field: "tipper_name"
        label_shown: "(auto-filled from request form or 'Anonymous')"
        required: false
        stored_on: "tips collection document"
        
      - field: "message"
        label_shown: "Message"
        required: false
        stored_on: "tips collection document"

    suggestion_form:
      - field: "suggested_title"
        label_shown: "Song Title"
        required: true
        stored_on: "song_suggestions collection"
        
      - field: "suggested_artist"
        label_shown: "Artist"
        required: true
        stored_on: "song_suggestions collection"
        
      - field: "requester_name"
        label_shown: "Your Name"
        required: false
        stored_on: "song_suggestions collection"
        
      - field: "requester_email"
        label_shown: "Your Email"
        required: false
        stored_on: "song_suggestions collection"
        
      - field: "message"
        label_shown: "Message"
        required: false
        stored_on: "song_suggestions collection"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Identity (Phase 2)
  # ─────────────────────────────────────────────────────────────────────────────
  identity:
    audience_id:
      generation_method: "crypto.randomUUID()"
      persistence_mechanism: "localStorage"
      storage_key: "requestwave_audience_id"
      generation_timing: "On first AudienceInterface component mount"
      lifecycle: "Persists indefinitely until user clears browser storage"
      
      attached_to:
        - action: "Request submission"
          endpoint: "POST /api/requests"
          payload_field: "audience_id"
          stored_in: "requests collection (audience_id field)"
          
        - action: "Tip submission"
          endpoint: "POST /api/musicians/{slug}/tips"
          payload_field: "audience_id"
          stored_in: "tips collection (audience_id field)"
          
        - action: "Click tracking (tip links)"
          endpoint: "POST /api/requests/{id}/track-click"
          payload_field: "audience_id"
          stored_in: "analytics_events only (metadata.audience_id)"
          
        - action: "Click tracking (social links)"
          endpoint: "POST /api/requests/{id}/track-click"
          payload_field: "audience_id"
          stored_in: "analytics_events only (metadata.audience_id)"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Audience Actions → Backend → Analytics
  # ─────────────────────────────────────────────────────────────────────────────
  actions_to_analytics:
    
    - action_name: "Request Submitted"
      frontend_trigger: "Submit button in request form modal"
      backend_endpoint: "POST /api/requests"
      payload_fields:
        - "song_id"
        - "requester_name"
        - "requester_email"
        - "dedication"
        - "tip_amount"
        - "audience_id"
      analytics_events_emitted:
        - event_type: "audience.request_submitted"
          always: true
          context: "musician_id, show_id (from musician's current_show_id)"
          metadata: "song_id, song_title, song_artist, has_dedication, tip_amount, audience_id"
        - event_type: "audience.dedication_submitted"
          conditional: "Only if dedication is non-empty after trim()"
          context: "musician_id, show_id, entity_id (request_id)"
          metadata: "song_id, song_title, dedication_length, audience_id"
          
    - action_name: "Tip Link Clicked"
      frontend_trigger: "Click on Venmo/PayPal/CashApp tip button in post-request modal"
      backend_endpoint: "POST /api/requests/{id}/track-click"
      payload_fields:
        - "type: 'tip'"
        - "platform (venmo|paypal|cashapp|zelle)"
        - "audience_id"
      analytics_events_emitted:
        - event_type: "audience.tip_clicked"
          always: true
          context: "musician_id (from request), show_id (from request), entity_id (request_id)"
          metadata: "platform, audience_id"
          
    - action_name: "Social/Follow Link Clicked"
      frontend_trigger: "Click on Instagram/Facebook/TikTok/Spotify/Apple Music link in social modal"
      backend_endpoint: "POST /api/requests/{id}/track-click"
      payload_fields:
        - "type: 'social'"
        - "platform (instagram|facebook|tiktok|spotify|apple_music)"
        - "audience_id"
      analytics_events_emitted:
        - event_type: "audience.follow_clicked"
          always: true
          context: "musician_id (from request), show_id (from request), entity_id (request_id)"
          metadata: "platform, audience_id"
          
    - action_name: "Tip Submitted"
      frontend_trigger: "Submit tip button (after entering amount and selecting platform)"
      backend_endpoint: "POST /api/musicians/{slug}/tips"
      payload_fields:
        - "amount"
        - "platform"
        - "tipper_name"
        - "message"
        - "audience_id"
        - "show_id (from musician's current_show_id if available)"
      analytics_events_emitted:
        - event_type: "audience.tip_completed"
          always: true
          context: "musician_id, show_id (from payload or musician's current_show_id), entity_id (tip_id)"
          metadata: "amount, platform, audience_id"
          
    - action_name: "Song Suggestion Submitted"
      frontend_trigger: "Submit button in suggestion modal"
      backend_endpoint: "POST /api/song-suggestions"
      payload_fields:
        - "suggested_title"
        - "suggested_artist"
        - "requester_name"
        - "requester_email"
        - "message"
      analytics_events_emitted:
        - event_type: "audience.suggestion_submitted"
          always: true
          context: "musician_id, show_id (auto-assigned or created)"
          metadata: "suggested_title, suggested_artist, has_message"
      note: "audience_id is NOT currently sent with suggestions"

    - action_name: "Email Submitted (Moment 3)"
      frontend_trigger: "Submit button in Moment 3 follow-up step (post-request)"
      backend_endpoint: "POST /api/requests/{id}/email"
      payload_fields:
        - "email"
        - "audience_id"
      analytics_events_emitted:
        - event_type: "audience.email_submitted"
          always: true
          context: "musician_id (from request), show_id (from request), entity_id (request_id)"
          metadata: "email_provided: true, audience_id"
      note: "Moment 3 optional follow-up. Raw email NOT included in analytics for privacy."

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Known Limitations
  # ─────────────────────────────────────────────────────────────────────────────
  known_limitations:
    - limitation: "No email validation"
      observed: "Email field accepts any non-empty string"
      
    - limitation: "No duplicate request prevention"
      observed: "Same audience can submit unlimited requests for same song"
      
    - limitation: "Tip payment is external only"
      observed: "App generates payment links; actual payment happens outside app. No payment confirmation flow."
      
    - limitation: "audience_id not attached to suggestions"
      observed: "Song suggestions do not include audience_id in payload"
      
    - limitation: "No request confirmation email"
      observed: "Audience provides email but receives no confirmation"
      
    - limitation: "Access check is session-based"
      observed: "Access check runs on page load; no real-time update if access changes mid-session"

# =============================================================================
# SECTION 7A: AUDIENCE MOMENT MODEL (PROPOSED)
# =============================================================================

audience_moment_model:
  description: >
    The Audience Moment Model defines intent-based phases of interaction for
    audience members using RequestWave. Moments represent shifts in intent,
    not specific screens. UI may change over time, but Moments remain stable
    unless explicitly revised.

  principles:
    - Requesting a song is the primary action.
    - Orientation is a side path, not a required step.
    - No optional action may block or interrupt requesting.
    - Audience identity is lightweight and purpose-driven.
    - Each Moment must have a clear entry and exit condition.

  moments:
    moment_0_arrival:
      name: Arrival
      intent: Awareness
      entry:
        - QR code scan
        - Direct audience link
      characteristics:
        - No data collection
        - Immediate signal that participation affects the live show
      exit:
        - User engages with song list
        - User opens orientation side path

    moment_1a_browse:
      name: Browse and Decide
      intent: Exploration
      characteristics:
        - Audience browses available songs
        - Songs are tappable to request
        - Secondary actions may exist but must not compete with requesting
      exit:
        - User selects a song (→ moment_1b_commit)

    moment_1b_commit:
      name: Commit to Song
      intent: Participation
      entry:
        - Triggered only by selecting a song
      characteristics:
        - Confirms selected song
        - Signals intent to request
      exit:
        - User proceeds to identity and dedication

    moment_2_identity:
      name: Identity and Dedication
      intent: Recognition
      requirements:
        - Name is required
      optional_fields:
        - Dedication or short note to the artist
      completion:
        - Submitting this moment creates a song request

    moment_3_follow_up:
      name: Optional Follow-Up
      intent: Continuity
      characteristics:
        - Optional email capture
        - Framed as helping the artist follow up
        - Fully skippable
      exit:
        - Completion or skip returns user to passive state

  exclusions:
    - Orientation content must not replace or delay requesting
    - Tips, follows, and artist info are not Moments
    - No Moment may be merged without a planning update

  related_specifications:
    orientation_side_path:
      document: "/app/memory/orientation_side_path_spec.yaml"
      status: "APPROVED - Implemented (Minimal)"
      description: >
        Defines the Orientation side path: a voluntary, parallel path for
        learning about the artist or supporting them without making a request.
        Orientation is explicitly NOT part of the request spine (Moments 1-3).
    tip_follow_sequencing:
      document: "/app/memory/tip_follow_sequencing_spec.yaml"
      status: "APPROVED"
      description: >
        Defines when and where tip/follow actions are allowed across surfaces.

  orientation_implementation:
    status: "IMPLEMENTED (Minimal - Phases A+B+C)"
    implementation_date: "2026-01-21"
    
    ui_component:
      type: "Bottom sheet"
      trigger_state: "showOrientation"
      file: "/app/frontend/src/App.js"
      css_animation: "/app/frontend/src/App.css (slideUp keyframes)"
    
    entry_points:
      - name: "Artist header tap"
        selector: '[data-testid="artist-header-orientation-trigger"]'
        behavior: "Opens Orientation bottom sheet"
      - name: "Header Tip button"
        selector: '[data-testid="header-tip-orientation-trigger"]'
        behavior: "Opens Orientation bottom sheet (tip section visible)"
    
    exit_points:
      - name: "Close button (X)"
        selector: '[data-testid="orientation-close-btn"]'
      - name: "Tap outside overlay"
        behavior: "Closes on background tap"
    
    content_sections:
      - section: "Artist photo + name"
        conditional: false
      - section: "Bio"
        conditional: "Only if designSettings.bio is non-empty"
      - section: "Tip links (Venmo, PayPal, Cash App, Zelle)"
        conditional: "Only if musician.tips_enabled and platforms configured"
      - section: "Social links (Instagram, Facebook, TikTok)"
        conditional: "Only if usernames configured"
      - section: "Streaming links (Spotify, Apple Music)"
        conditional: "Only if URLs configured"
      - section: "Website link"
        conditional: "Only if musician.website configured"
    
    deferred_features:
      - "Mailing list email capture"
      - "Orientation-specific analytics events (orientation_* prefix)"
      - "Musician configurability"

  click_tracking_status:
    description: >
      Click tracking for outbound links (tip platforms, social media, streaming).
      Off-platform completion cannot be tracked; only outbound click intent.
    
    post_request_tracking:
      status: "IMPLEMENTED"
      endpoint: "POST /api/requests/{request_id}/track-click"
      tracked_actions:
        - action: "Tip link click"
          click_type: "tip"
          platforms: ["venmo", "paypal", "cashapp", "zelle"]
          event_emitted: "audience.tip_clicked"
          request_id_required: true
        - action: "Social/Follow link click"
          click_type: "social"
          platforms: ["instagram", "facebook", "tiktok", "spotify", "apple_music"]
          event_emitted: "audience.follow_clicked"
          request_id_required: true
      implementation:
        frontend_function: "trackClick(type, platform)"
        guard: "if (!currentRequestId) return;"
        file: "/app/frontend/src/App.js"
    
    orientation_tracking:
      status: "NOT IMPLEMENTED"
      limitation: >
        Orientation link clicks are NOT tracked because no request_id exists.
        The existing track-click endpoint requires a request_id to associate
        the click with a specific request record.
      reason: >
        Per spec, we do not invent requests just for tracking, and no new
        endpoints are created in this phase.
      future_consideration: >
        If tracking Orientation clicks becomes a requirement, a new endpoint
        (e.g., POST /api/musicians/{slug}/orientation-click) would be needed
        that does not require request_id but still logs to analytics_events.

# =============================================================================
# SECTION 7B: AUDIENCE EXPERIENCE → MOMENT MODEL MAPPING (ANALYSIS)
# =============================================================================
# Gap analysis mapping current audience elements to the Audience Moment Model.
# This is descriptive and analytical only. No fixes or proposals.

audience_experience_moment_mapping:

  # ─────────────────────────────────────────────────────────────────────────────
  # ENTRY AND ARRIVAL ELEMENTS
  # ─────────────────────────────────────────────────────────────────────────────
  
  - element_name: "Landing View (QR Entry)"
    current_location: "/musician/:slug page load"
    current_behavior: >
      Page loads musician profile, songs, filters, playlists, and design settings.
      Access check performed. Full song list displayed immediately with all UI
      elements visible (search, filters, sort, header).
    mapped_moment: "moment_0_arrival"
    alignment_status: "partially_aligned"
    notes: >
      Model expects "Immediate signal that participation affects the live show"
      but current UI shows full song browser without explicit live show context
      or participation framing. No distinct arrival state exists; page loads
      directly into browsing state.

  - element_name: "Artist Header / Artist Name Display"
    current_location: "Top of /musician/:slug page"
    current_behavior: >
      Displays musician name, bio, and artist photo (if configured). Header is
      static and always visible. Tapping artist name/header has no action.
    mapped_moment: "moment_0_arrival"
    alignment_status: "aligned"
    notes: >
      Provides awareness of which artist the audience is interacting with.
      Consistent with arrival intent. No blocking behavior.

  - element_name: "Artist Photo"
    current_location: "Header area of /musician/:slug page"
    current_behavior: >
      Displays artist photo if musician has configured one. Static display,
      not interactive.
    mapped_moment: "moment_0_arrival"
    alignment_status: "aligned"
    notes: >
      Supports awareness and artist recognition. No blocking behavior.

  # ─────────────────────────────────────────────────────────────────────────────
  # BROWSE AND EXPLORATION ELEMENTS
  # ─────────────────────────────────────────────────────────────────────────────

  - element_name: "Song List / Song Grid"
    current_location: "Main content area of /musician/:slug page"
    current_behavior: >
      Displays all available songs in grid or list format (based on layout_mode).
      Each song is tappable. Tapping opens request modal.
    mapped_moment: "moment_1a_browse"
    alignment_status: "aligned"
    notes: >
      Core browse element. Songs are tappable to request. Exit condition
      (song selection) leads to request flow. Fully aligned with model.

  - element_name: "Search Bar"
    current_location: "Above song list on /musician/:slug page"
    current_behavior: >
      Text input for filtering songs by title or artist. Filters displayed
      songs in real-time as user types.
    mapped_moment: "moment_1a_browse"
    alignment_status: "aligned"
    notes: >
      Supports exploration intent. Does not block or delay requesting.
      Secondary action that enhances primary browse flow.

  - element_name: "Filter Dropdowns (Genre, Playlist, Mood, Decade)"
    current_location: "Filter bar above song list"
    current_behavior: >
      Dropdown selectors for filtering songs by genre, playlist, mood, and
      decade. Multiple filters can be combined. Filters songs in real-time.
    mapped_moment: "moment_1a_browse"
    alignment_status: "aligned"
    notes: >
      Supports exploration intent. Does not block or delay requesting.
      Secondary actions that enhance discovery.

  - element_name: "Sort Options (Most Popular, A-Z, Newest, Random)"
    current_location: "Sort selector near filter bar"
    current_behavior: >
      Dropdown or buttons to change song list ordering. Default varies.
      Changes take effect immediately.
    mapped_moment: "moment_1a_browse"
    alignment_status: "aligned"
    notes: >
      Supports exploration intent. Does not compete with requesting.

  - element_name: "Random Song Selector ('Pick Random Song' button)"
    current_location: "Above or within song list area"
    current_behavior: >
      Button that selects a random song from the filtered list. Opens request
      modal for the randomly selected song.
    mapped_moment: "moment_1a_browse → moment_1b_commit"
    alignment_status: "aligned"
    notes: >
      Alternative path to song selection. Bypasses manual browsing but
      correctly triggers commit flow. Aligned with model.

  # ─────────────────────────────────────────────────────────────────────────────
  # COMMIT AND REQUEST ELEMENTS
  # ─────────────────────────────────────────────────────────────────────────────

  - element_name: "Song Tap → Request Modal Open"
    current_location: "Triggered by tapping song card"
    current_behavior: >
      Tapping a song card opens the request form modal. Modal displays
      selected song title and artist. Contains name, email, dedication fields.
    mapped_moment: "moment_1b_commit → moment_2_identity"
    alignment_status: "partially_aligned"
    notes: >
      Model defines moment_1b_commit as confirming selected song and signaling
      intent, separate from identity capture. Current implementation merges
      commit and identity into a single modal. No distinct "confirm song"
      step before identity fields appear.

  - element_name: "Name Field (Request Form)"
    current_location: "Request form modal"
    current_behavior: >
      Text input labeled 'Your Name'. Required field. Must be non-empty to
      submit request.
    mapped_moment: "moment_2_identity"
    alignment_status: "aligned"
    notes: >
      Model requires name. Current implementation makes name required.
      Aligned with model.

  - element_name: "Dedication Field (Request Form)"
    current_location: "Request form modal"
    current_behavior: >
      Text input labeled 'Dedication (optional)'. Optional field. Can be
      empty or contain any text.
    mapped_moment: "moment_2_identity"
    alignment_status: "aligned"
    notes: >
      Model lists dedication as optional. Current implementation makes it
      optional. Aligned with model.

  - element_name: "Email Field (Request Form)"
    current_location: "Moment 3 follow-up step (post-request submission)"
    current_behavior: >
      Text input labeled 'Your Email'. Now OPTIONAL and shown after request
      is submitted. Submits via POST /api/requests/{id}/email endpoint.
      Basic format validation (regex). Fully skippable.
    mapped_moment: "moment_3_follow_up"
    alignment_status: "aligned"
    notes: >
      RESOLVED: Email moved from required field in moment_2_identity to
      optional field in moment_3_follow_up. Now aligned with model principle
      "No optional action may block requesting."

  - element_name: "Request Submit Button"
    current_location: "Request form modal"
    current_behavior: >
      Button to submit the request. Validates required fields (name, email).
      On success, creates request and proceeds to tip modal (if enabled)
      or social modal.
    mapped_moment: "moment_2_identity (completion)"
    alignment_status: "aligned"
    notes: >
      Completes moment_2_identity by creating the request. Aligned with
      model's completion definition.

  # ─────────────────────────────────────────────────────────────────────────────
  # POST-REQUEST ELEMENTS
  # ─────────────────────────────────────────────────────────────────────────────

  - element_name: "Post-Request Tip Modal"
    current_location: "Modal appearing after request submission"
    current_behavior: >
      If musician.tips_enabled is true, tip modal appears immediately after
      request submission. Shows preset amounts ($1, $5, $10, $20), custom
      input, and payment platform selection. Can be skipped.
    mapped_moment: "Not a defined Moment"
    alignment_status: "misaligned"
    notes: >
      Model explicitly excludes tips from Moments: "Tips, follows, and artist
      info are not Moments." Current implementation presents tip modal as
      a required step in the flow (even if skippable), interrupting the
      path between request completion and follow-up. Violates principle
      "No optional action may block or interrupt requesting."

  - element_name: "Tip Amount Selector"
    current_location: "Tip modal"
    current_behavior: >
      Preset buttons ($1, $5, $10, $20) and custom amount input. Selecting
      amount is required to proceed with tip submission.
    mapped_moment: "Not a defined Moment"
    alignment_status: "misaligned"
    notes: >
      Part of tip flow which is excluded from Moment Model. Should not be
      presented as a step in the core request flow.

  - element_name: "Tip Payment Platform Selector"
    current_location: "Tip modal"
    current_behavior: >
      Buttons or selector for Venmo, PayPal, CashApp, Zelle. Must select
      platform to submit tip.
    mapped_moment: "Not a defined Moment"
    alignment_status: "misaligned"
    notes: >
      Part of tip flow which is excluded from Moment Model.

  - element_name: "Tip Links (Venmo/PayPal/CashApp/Zelle buttons)"
    current_location: "Tip modal"
    current_behavior: >
      Clicking a tip payment button opens external payment link in new tab
      and records tip_clicked event.
    mapped_moment: "Not a defined Moment"
    alignment_status: "misaligned"
    notes: >
      Tips are explicitly excluded from Moments. Current placement as
      post-request step conflicts with model.

  - element_name: "Social Follow Modal"
    current_location: "Modal appearing after tip flow (or if tips disabled)"
    current_behavior: >
      Displays links to musician's social profiles (Instagram, Facebook,
      TikTok, Spotify, Apple Music). Can be closed to return to song list.
    mapped_moment: "Not a defined Moment"
    alignment_status: "misaligned"
    notes: >
      Model explicitly excludes follows from Moments: "Tips, follows, and
      artist info are not Moments." Current implementation presents social
      modal as a step in the flow. Model expects moment_3_follow_up to
      handle optional email, not social links.

  - element_name: "Social/Follow Links (Instagram, Spotify, etc.)"
    current_location: "Social modal"
    current_behavior: >
      Clickable links/buttons that open musician's social profiles in new
      tab and record follow_clicked event.
    mapped_moment: "Not a defined Moment"
    alignment_status: "misaligned"
    notes: >
      Follows are explicitly excluded from Moments. Should not be
      presented as part of the request flow.

  - element_name: "Post-Request Confirmation State"
    current_location: "After completing tip/social modals"
    current_behavior: >
      No explicit confirmation state. After closing social modal, user
      returns to song list. No persistent indicator that request was
      submitted.
    mapped_moment: "moment_3_follow_up (exit)"
    alignment_status: "partially_aligned"
    notes: >
      Model expects exit from moment_3_follow_up to return user to
      "passive state". Current implementation returns to browse state
      which is reasonable. However, no confirmation of successful
      request is shown, and no email capture opportunity exists
      per moment_3_follow_up definition.

  # ─────────────────────────────────────────────────────────────────────────────
  # ALTERNATIVE FLOWS
  # ─────────────────────────────────────────────────────────────────────────────

  - element_name: "Suggest-a-Song Button"
    current_location: "Song list area (button visible when browsing)"
    current_behavior: >
      Opens suggestion form modal. Allows audience to suggest songs not in
      musician's library. Separate flow from song request.
    mapped_moment: "moment_1a_browse (alternative path)"
    alignment_status: "partially_aligned"
    notes: >
      Represents an alternative to the primary request flow. Does not map
      directly to any Moment. Model does not define a Moment for suggestions.
      Current placement in browse area is reasonable but creates a
      parallel flow outside the Moment Model.

  - element_name: "Suggestion Form Modal"
    current_location: "Modal opened by 'Suggest a Song' button"
    current_behavior: >
      Form with song title (required), artist (required), name (optional),
      email (optional), message (optional). Submits to song_suggestions
      collection.
    mapped_moment: "Not a defined Moment"
    alignment_status: "partially_aligned"
    notes: >
      Suggestion flow is a parallel path not covered by Moment Model.
      Does not block or interrupt requesting. Identity fields are optional
      unlike request form. Not inherently misaligned but represents
      undefined territory.

  # ─────────────────────────────────────────────────────────────────────────────
  # SUMMARY: ALIGNMENT OVERVIEW
  # ─────────────────────────────────────────────────────────────────────────────
  
  alignment_summary:
    total_elements_analyzed: 20
    
    aligned: 11
    aligned_elements:
      - "Artist Header / Artist Name Display"
      - "Artist Photo"
      - "Song List / Song Grid"
      - "Search Bar"
      - "Filter Dropdowns"
      - "Sort Options"
      - "Random Song Selector"
      - "Name Field"
      - "Dedication Field"
      - "Request Submit Button"
      - "Email Field (moved to Moment 3)"
    
    partially_aligned: 5
    partially_aligned_elements:
      - element: "Landing View (QR Entry)"
        reason: "No distinct arrival state or live show context signal"
      - element: "Song Tap → Request Modal Open"
        reason: "Merges moment_1b_commit and moment_2_identity"
      - element: "Post-Request Confirmation State"
        reason: "No email capture per moment_3_follow_up; no visible confirmation"
      - element: "Suggest-a-Song Button"
        reason: "Alternative flow not defined in Moment Model"
      - element: "Suggestion Form Modal"
        reason: "Parallel flow outside Moment Model scope"
    
    misaligned: 4
    misaligned_elements:
      - element: "Post-Request Tip Modal"
        reason: "Tips excluded from Moments but presented as flow step"
        severity: "medium"
        principle_violated: "Tips are not Moments"
      - element: "Tip Amount Selector"
        reason: "Part of excluded tip flow"
        severity: "medium"
      - element: "Tip Links"
        reason: "Part of excluded tip flow"
        severity: "medium"
      - element: "Social Follow Modal"
        reason: "Follows excluded from Moments but presented as flow step"
        severity: "medium"
        principle_violated: "Follows are not Moments"

  # ─────────────────────────────────────────────────────────────────────────────
  # KEY GAPS IDENTIFIED
  # ─────────────────────────────────────────────────────────────────────────────
  
  key_gaps:
    
    - gap_id: "GAP-01"
      gap_name: "Email Required at Wrong Moment"
      current_state: "RESOLVED - Email moved to optional Moment 3 follow-up step"
      model_expectation: "Email optional in moment_3_follow_up"
      resolution: "Email removed from request form; now captured post-submission via dedicated endpoint"
      status: "CLOSED"
      
    - gap_id: "GAP-02"
      gap_name: "No Distinct Arrival Experience"
      current_state: "Page loads directly into full browse state"
      model_expectation: "moment_0_arrival should signal live show participation"
      impact: "Missed opportunity for engagement framing"
      
    - gap_id: "GAP-03"
      gap_name: "Commit and Identity Merged"
      current_state: "Song tap opens form with identity fields"
      model_expectation: "moment_1b_commit confirms song before identity"
      impact: "No clear separation of intent phases"
      
    - gap_id: "GAP-04"
      gap_name: "Tips/Follows in Request Flow"
      current_state: "Tip modal and social modal appear as post-request steps"
      model_expectation: "Tips and follows are not Moments"
      impact: "Optional actions interrupt primary flow"
      
    - gap_id: "GAP-05"
      gap_name: "No moment_3_follow_up Implementation"
      current_state: "RESOLVED - Optional email capture implemented in Moment 3 post-request step"
      model_expectation: "moment_3_follow_up offers optional email for artist continuity"
      resolution: "POST /api/requests/{id}/email endpoint added; frontend shows optional email step after request submission"
      status: "CLOSED"

# =============================================================================
# SECTION 8: MUSICIAN EXPERIENCE (CURRENT STATE)
# =============================================================================
# Factual snapshot of musician-facing functionality as implemented.

musician_experience_current_state:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Entry and Authentication
  # ─────────────────────────────────────────────────────────────────────────────
  entry_and_authentication:
    login_url: "/ (root - shows login form)"
    authentication_method: "JWT token stored in localStorage"
    login_endpoint: "POST /api/auth/login"
    registration_endpoint: "POST /api/auth/register"
    session_persistence: "Token stored in localStorage; persists across browser sessions"
    prerequisites_for_dashboard:
      - "Valid JWT token in localStorage"
      - "Token verified on each API request"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Show Lifecycle
  # ─────────────────────────────────────────────────────────────────────────────
  show_lifecycle:
    show_creation:
      explicit: "Musician clicks 'Start a Show' button, enters show name"
      implicit: "Auto-created when first request or suggestion arrives and no active show exists"
      endpoint: "POST /api/shows/start"
      
    active_show_definition: >
      A show is "active" when musician.current_show_id is set to that show's ID.
      Only one show can be active at a time per musician.
      
    show_end:
      explicit: "Musician clicks 'Stop Show' button"
      endpoint: "POST /api/shows/stop"
      behavior: "Clears musician.current_show_id and current_show_name"
      note: "Show remains in 'active' status (not archived); can be reopened"
      
    show_archival:
      trigger: "Musician clicks 'Archive' button on a show"
      endpoint: "PUT /api/shows/{id}/archive"
      behavior: "Sets show.status to 'archived'; show moves to archived section"
      
    show_restore:
      trigger: "Musician clicks 'Restore' button on archived show"
      endpoint: "PUT /api/shows/{id}/restore"
      behavior: "Sets show.status back to 'active'"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Primary Views/Tabs
  # ─────────────────────────────────────────────────────────────────────────────
  primary_views:
    
    - tab_name: "On Stage"
      tab_id: "onstage"
      purpose: "Live performance management - focused view for active shows"
      data_shown:
        - "Up Next panel: requests with status='up_next' for current show"
        - "Live Requests panel: merged pending requests + pending suggestions for current show"
        - "Completed panel: played/rejected requests and handled suggestions for current show"
      scoping: "Strictly scoped to current_show_id only"
      actions_available:
        - "Mark request as Played"
        - "Mark request as Skipped (rejected)"
        - "Move request to Up Next"
        - "Match suggestion to existing song"
        - "Mark suggestion as Learn Later"
        - "Skip suggestion"
      empty_state: "Shows 'No Active Show' message with button to start show"
      
    - tab_name: "Songs"
      tab_id: "songs"
      purpose: "Manage song library"
      data_shown:
        - "List/grid of all songs for musician"
        - "Playlists"
        - "Learn Later toggle (shows suggestions marked as learn_later)"
      actions_available:
        - "Add single song"
        - "CSV upload (bulk import)"
        - "Edit song metadata"
        - "Delete song"
        - "Hide/unhide song from audience view"
        - "Create/edit playlists"
        - "Manage Learn Later suggestions"
      scoping: "Shows all songs regardless of show"
      
    - tab_name: "Requests"
      tab_id: "requests"
      purpose: "View and manage all requests across shows"
      data_shown:
        - "Shows grouped by show_name (expandable folders)"
        - "Requests within each show"
        - "Song suggestions section (pending suggestions)"
        - "Archived shows section (collapsed by default)"
      scoping: "All shows visible; can expand any show to see its requests"
      actions_available:
        - "Start/Stop show"
        - "Open/view specific show"
        - "Archive show"
        - "Batch select requests"
        - "Batch mark as Played/Skipped"
        - "Batch archive/delete requests"
        - "Handle song suggestions (Match, Learn Later, Skip)"
        - "Restore archived shows"
        
    - tab_name: "Analytics"
      tab_id: "analytics"
      purpose: "View performance statistics"
      data_shown:
        - "Total requests count"
        - "Unique requesters count"
        - "Most requested songs (top songs list)"
        - "Top requesters (with request counts, tip totals)"
        - "Period selector: Today, 7 days, 30 days, 365 days, All Time"
      scoping: "Filtered by selected time period; spans all shows"
      actions_available:
        - "Change time period filter"
        - "Expand top requesters list"
        
    - tab_name: "Profile"
      tab_id: "profile"
      purpose: "Manage musician account and settings"
      data_shown:
        - "Account info (name, email, slug)"
        - "Social media links"
        - "Tip platform settings (PayPal, Venmo, CashApp, Zelle)"
        - "Audience link settings"
      actions_available:
        - "Update profile info"
        - "Configure tip platforms"
        - "Enable/disable requests"
        - "Enable/disable tips"
        
    - tab_name: "Subscription"
      tab_id: "subscription"
      conditional: "Only shown if BILLING_ENABLED=true"
      purpose: "Manage subscription and billing"
      data_shown:
        - "Current plan status"
        - "Trial info (if applicable)"
        - "Billing dates"
      actions_available:
        - "Upgrade plan"
        - "Cancel subscription"
        
    - tab_name: "Design"
      tab_id: "design"
      purpose: "Customize audience-facing page appearance"
      data_shown:
        - "Color theme options"
        - "Layout mode (grid/list)"
        - "Artist photo"
        - "Bio/name display settings"
      actions_available:
        - "Change color theme"
        - "Change layout mode"
        - "Upload artist photo"
        - "Update displayed name/bio"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Live vs Non-Live Behavior
  # ─────────────────────────────────────────────────────────────────────────────
  live_vs_nonlive:
    when_show_active:
      - "On Stage tab shows live requests/suggestions scoped to active show"
      - "Green 'Live' indicator in header/nav"
      - "'Stop Show' button visible"
      - "New requests automatically associated with active show"
      
    when_no_active_show:
      - "On Stage tab shows 'No Active Show' empty state"
      - "'Start a Show' button visible"
      - "Requests tab shows past shows but no live indicator"
      - "Incoming requests/suggestions trigger auto-show creation"
      
    safeguards_against_cross_show_leakage:
      - "On Stage tab queries include show_id parameter (API-level filtering)"
      - "Frontend filters displayed items by show_id match"
      - "Requests endpoint accepts optional show_id query param for scoped queries"
      - "Suggestions endpoint accepts optional show_id query param for scoped queries"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Request Handling
  # ─────────────────────────────────────────────────────────────────────────────
  request_handling:
    entry_point: "Requests created by audience via POST /api/requests"
    association: "Each request has show_id linking to the show active at creation time"
    
    statuses:
      - status: "pending"
        meaning: "New request, not yet handled"
      - status: "accepted"
        meaning: "Acknowledged but not yet played"
      - status: "up_next"
        meaning: "Queued for immediate play (shown in Up Next panel)"
      - status: "played"
        meaning: "Song was performed"
      - status: "rejected"
        meaning: "Request was skipped/declined"
      - status: "archived"
        meaning: "Hidden from active views but preserved in database"
        
    musician_actions:
      - action: "Mark as Played"
        sets_status: "played"
        emits_event: "musician.request_played"
      - action: "Mark as Skipped"
        sets_status: "rejected"
        emits_event: "musician.request_skipped"
      - action: "Move to Up Next"
        sets_status: "up_next"
        emits_event: null
      - action: "Archive"
        sets_status: "archived"
        emits_event: null
      - action: "Restore"
        sets_status: "pending"
        emits_event: "musician.request_restored"
      - action: "Delete"
        behavior: "Permanently removes from database"
        emits_event: null
        
    ordering: "Requests displayed in chronological order (oldest first) within each panel"
    grouping: "In Requests tab, requests grouped by show_name in expandable folders"

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Tips and Follows Visibility
  # ─────────────────────────────────────────────────────────────────────────────
  tips_and_follows_visibility:
    tip_visibility:
      where_shown:
        - "Analytics tab: Top Requesters shows total_tips per requester"
        - "Individual request cards: tip_amount shown if > 0"
      real_time: false
      note: "Tips recorded in tips collection; displayed in aggregate in analytics"
      
    follow_click_visibility:
      where_shown: "Not currently displayed to musicians in any UI"
      stored_in: "analytics_events collection only"
      note: "Data is captured but no musician-facing UI shows follow metrics"
      
    tip_click_visibility:
      where_shown: "Not currently displayed to musicians in any UI"
      stored_in: "analytics_events collection only"
      note: "Data is captured but no musician-facing UI shows tip click metrics"

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. Known Limitations
  # ─────────────────────────────────────────────────────────────────────────────
  known_limitations:
    - limitation: "No show rename functionality"
      observed: "Once created, show name cannot be changed"
      
    - limitation: "No request reordering"
      observed: "Requests displayed chronologically; no drag-and-drop or manual ordering"
      
    - limitation: "Follow/tip click analytics not surfaced in UI"
      observed: "Events logged but no dashboard view to see engagement metrics"
      
    - limitation: "Tips not verified"
      observed: "Tip records created on intent; no confirmation that external payment completed"
      
    - limitation: "Single active show constraint"
      observed: "Only one show can be active at a time; cannot run parallel shows"
      
    - limitation: "No real-time push updates"
      observed: "Dashboard polls for new requests; not instant push notifications"
      polling_interval: "On Stage tab polls every few seconds when active"
      
    - limitation: "Monolithic frontend"
      observed: "App.js contains all components (~12,000+ lines)"
      impact: "Maintenance complexity, slow hot reloads"
